# The Gemini's daily desktop: sway, GPU-composited on panfrost.
#
# Started by sddm via /usr/share/wayland-sessions/gemini-sway.desktop ->
# /usr/local/bin/gemini-session, which is where WLR_RENDERER=gles2 and
# WLR_RENDER_DRM_DEVICE are set. Switched from LXQt-on-X on 2026-08-22, once
# #56 was fixed: before that a GPU-composited compositor wedged the SoC
# roughly one run in three.

# Sway's own defaults FIRST, because this file used to contain nothing but the
# two output lines below — which meant the session had no keybindings at all.
# No terminal, no window controls, no bar, nothing but a blue background. The
# include brings Mod4 bindings, $mod+Return for a terminal, and swaybar.
include /etc/sway/config

# --- Gemini overrides. After the include, so they win. --------------------

# 270, not 90. 90 is 180 degrees out and the panel reads upside down; the
# "correctly oriented" photograph that justified 90 was of a solid orange
# rectangle. A Wayland compositor applies its output transform to touch as
# well, so this rotates the touchscreen with the display — do NOT also rotate
# touch in the device tree or it is applied twice (B-41).
output DSI-1 transform 270 pos 0 0

# The DisplayLink monitor when one is attached. Both outputs get an explicit
# position: give only one a pos and sway stacks them at the origin.
output VGA-1 pos 2160 0

# $menu is wmenu-run in the stock config and wmenu is not installed here, so
# $mod+d does nothing. LXQt's own runner needs qt6-wayland, which needs the
# device to be online to install. Terminal-first until then: $mod+Return.
set $term foot

# LXQt's applications still run — Xwayland is started on demand and gives X
# clients Mali-T880 (Panfrost), not llvmpipe. The LXQt *panel* is not started
# here because without qt6-wayland it can only be an ordinary X window rather
# than a dock, which is worse than swaybar.
exec_always --no-startup-id env QT_QPA_PLATFORM=xcb lxqt-policykit-agent
exec_always --no-startup-id env QT_QPA_PLATFORM=xcb lxqt-notificationd
