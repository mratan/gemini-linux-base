# CI baseline build (mratan fork — gemini_linux tracker issue #2, "Slice 1").
#
# Builds the unmodified Base tree pipeline from a clean checkout on every push:
# vanilla kernel.org v6.6 + patches/v6.6/ (scripts/build.sh patch) + configs/
# fragments (scripts/build.sh config), cross-compiled for arm64, publishing
# hashed artifacts (Image.gz + mt6797-gemini-pda.dtb + .config + SHA256SUMS).
name: kernel-build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Check out project tree
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev \
            kmod cpio rsync

      - name: Fetch vanilla Linux v6.6 (the pinned kernel base)
        run: |
          git clone --depth 1 --branch v6.6 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$GITHUB_WORKSPACE/linux-6.6"

      - name: Apply project patches (scripts/build.sh patch)
        run: |
          LINUX_SRC="$GITHUB_WORKSPACE/linux-6.6" \
          PATCHES_DIR="$GITHUB_WORKSPACE/patches/v6.6" \
            ./scripts/build.sh patch

      - name: Generate .config (defconfig + fragments)
        run: |
          LINUX_SRC="$GITHUB_WORKSPACE/linux-6.6" \
          CONFIG_FRAGMENTS="$GITHUB_WORKSPACE/configs" \
            ./scripts/build.sh config

      # gemini-consys.config embeds the proprietary CONSYS firmware into the
      # kernel (CONFIG_EXTRA_FIRMWARE) from a path that only exists on the
      # private build machine. Those blobs must never land in a public repo or
      # public CI artifact, so the CI baseline builds without them; the embed
      # happens at local packaging time instead.
      - name: Drop private EXTRA_FIRMWARE embed (blobs stay off public CI)
        run: |
          cd "$GITHUB_WORKSPACE/linux-6.6"
          ./scripts/config --set-str EXTRA_FIRMWARE ""
          ./scripts/config --set-str EXTRA_FIRMWARE_DIR ""
          make ARCH=arm64 olddefconfig

      - name: Build Image.gz + dtbs + modules
        run: |
          LINUX_SRC="$GITHUB_WORKSPACE/linux-6.6" \
          BUILD_NN="${{ github.run_number }}" \
            ./scripts/build.sh build

      # Track 3 / Slices VS1+VS2 (tracker issues #13, #16): DT-binding seam for
      # the new External-display nodes. Validate the SiI9024A bridge
      # (sil,sii9022 on I2C3), the MT6797 DPI encoder (mediatek,mt6797-dpi), the
      # HDMI connector, and the VS2 right-port mux (planet,gemini-rightport-mux)
      # against their schemas with `dtbs_check`, so wiring errors surface
      # Device-free. Scoped via DT_SCHEMA_FILES to just these schemas: the
      # pre-existing MT6797 display nodes (ovl/rdma/dsi/... whose compatibles are
      # not yet in mainline bindings) are out of this slice's scope and would
      # otherwise drown the signal. The mux schema is the in-tree binding added
      # by patches/v6.6/misc/0001. Fails the build if any of the new nodes
      # reports a schema error.
      - name: dtbs_check — External-display nodes (sii9022 + mt6797 DPI + mux)
        run: |
          python3 -m pip install --break-system-packages --quiet dtschema yamllint
          # Ensure the dtschema console scripts are reachable; without dt-validate
          # on PATH `make CHECK_DTBS=y` silently skips validation (a false pass),
          # so assert it resolves before trusting the gate.
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          command -v dt-validate >/dev/null || { echo "dt-validate not found after pip install"; exit 1; }
          cd "$GITHUB_WORKSPACE/linux-6.6"
          fail=0
          # Check both the default board dtb (HDMI nodes disabled) and the
          # opt-in mt6797-gemini-pda-hdmi variant (Slice VS1b — the same nodes
          # enabled, forming the real OVL1->RDMA1->DSC0->DPI0->sii9022 pipe that
          # instantiates the second CRTC). Both must validate clean.
          for name in mt6797-gemini-pda mt6797-gemini-pda-hdmi ; do
            dtb="arch/arm64/boot/dts/mediatek/$name.dtb"
            for sch in \
                display/bridge/sil,sii9022.yaml \
                display/mediatek/mediatek,dpi.yaml \
                connector/hdmi-connector.yaml \
                misc/planet,gemini-rightport-mux.yaml ; do
              echo "== dtbs_check $name : $sch =="
              rm -f "$dtb"
              out=$(make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                         CHECK_DTBS=y DT_SCHEMA_FILES="$sch" \
                         "mediatek/$name.dtb" 2>&1)
              # dtbs_check prints one line per validation failure, tagged with the
              # offending DTB path + node. Any such line for our DTB is a failure.
              nodeerr=$(echo "$out" | grep -E "$name\.dtb:.*(dpi@1401e000|hdmi-bridge@39|sii9022|/connector|hdmi_connector|rightport-mux)" || true)
              if [ -n "$nodeerr" ]; then
                echo "$nodeerr"
                echo "FAIL: schema errors for new nodes under $sch ($name)"
                fail=1
              else
                echo "  ok"
              fi
            done
          done
          if [ "$fail" != 0 ]; then exit 1; fi
          echo "dtbs_check passed for the new External-display nodes"

      # Slices 5 & 9 (tracker issues #6, #10): the vendored connectivity
      # modules — WMT core, BTIF, Wi-Fi chardev and the Gen3 WLAN driver —
      # must compile and pass modpost against the kernel built above, on
      # every change. (The gen3 config fragment in configs/ is merged by the
      # config step above, enabling NL80211_TESTMODE / WEXT that gen3 needs.)
      - name: Build connectivity modules (WMT core + BTIF + Gen3 WLAN)
        run: |
          make -C "$GITHUB_WORKSPACE/linux-6.6" \
            M="$GITHUB_WORKSPACE/modules/connectivity" modules

      # Slice U1 (tracker issue #26, PRD #25, ADR-0004): the USB-display
      # stack. First assert the gemini-usbdisplay.config fragment SURVIVED
      # the merge_config + olddefconfig passes — a silently-dropped symbol
      # (missing dependency) must fail loudly here, not surface as a missing
      # udl.ko on the device. Then assert the in-tree udl module was actually
      # produced, together with drm_shmem_helper.ko — udl's select-driven
      # hard dep (the helper has no Kconfig prompt and CANNOT be forced =y;
      # see configs/gemini-usbdisplay.config and commit f42d736).
      - name: "USB display (U1): config fragment survived + udl.ko built"
        run: |
          cd "$GITHUB_WORKSPACE/linux-6.6"
          grep -q '^CONFIG_DRM_UDL=m$' .config \
            || { echo "::error::CONFIG_DRM_UDL=m dropped from merged .config"; exit 1; }
          # DRM_GEM_SHMEM_HELPER is select-driven (no Kconfig prompt) and
          # lands =m via udl's select — its .ko is a hard dep of udl.ko and
          # must ship with it (see configs/gemini-usbdisplay.config).
          grep -q '^CONFIG_DRM_GEM_SHMEM_HELPER=m$' .config \
            || { echo "::error::CONFIG_DRM_GEM_SHMEM_HELPER not =m — udl dep shape changed, update staging"; exit 1; }
          test -f drivers/gpu/drm/udl/udl.ko \
            || { echo "::error::udl.ko not produced by kernel build"; exit 1; }
          test -f drivers/gpu/drm/drm_shmem_helper.ko \
            || { echo "::error::drm_shmem_helper.ko not produced (udl.ko dep)"; exit 1; }
          echo "U1 config + in-tree udl.ko + drm_shmem_helper.ko OK"

      # Slice U1: the vendored evdi module (modules/evdi, pinned to the
      # version the aarch64 DisplayLinkManager pairs with — PROVENANCE.md)
      # must compile and pass modpost against this kernel on every change,
      # exactly like the connectivity modules.
      - name: Build evdi module (USB display secondary route)
        run: |
          make -C "$GITHUB_WORKSPACE/linux-6.6" \
            M="$GITHUB_WORKSPACE/modules/evdi" modules
          test -f "$GITHUB_WORKSPACE/modules/evdi/evdi.ko"

      - name: Collect and hash artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$GITHUB_WORKSPACE/linux-6.6/arch/arm64/boot/Image.gz" \
             "$GITHUB_WORKSPACE/out/"
          cp "$GITHUB_WORKSPACE/linux-6.6/arch/arm64/boot/dts/mediatek/mt6797-gemini-pda.dtb" \
             "$GITHUB_WORKSPACE/out/"
          # Opt-in variant DTBs must ship staged+hashed too, or the physical
          # session has nothing verified to pack: the HDMI bring-up variant
          # (dts/0028, runbook Appendix A) and the U2 usbexp experiment
          # variant (dts/0029, issue #27 test plan).
          cp "$GITHUB_WORKSPACE/linux-6.6/arch/arm64/boot/dts/mediatek/mt6797-gemini-pda-hdmi.dtb" \
             "$GITHUB_WORKSPACE/out/"
          cp "$GITHUB_WORKSPACE/linux-6.6/arch/arm64/boot/dts/mediatek/mt6797-gemini-pda-usbexp.dtb" \
             "$GITHUB_WORKSPACE/out/"
          cp "$GITHUB_WORKSPACE/linux-6.6/.config" "$GITHUB_WORKSPACE/out/kernel.config"
          cp "$GITHUB_WORKSPACE"/modules/connectivity/*.ko "$GITHUB_WORKSPACE/out/"
          # Slice U1: USB-display modules ride the same artifact so
          # release-assemble can stage + depmod-verify them (issue #26).
          cp "$GITHUB_WORKSPACE/linux-6.6/drivers/gpu/drm/udl/udl.ko" "$GITHUB_WORKSPACE/out/"
          cp "$GITHUB_WORKSPACE/linux-6.6/drivers/gpu/drm/drm_shmem_helper.ko" "$GITHUB_WORKSPACE/out/"
          cp "$GITHUB_WORKSPACE/modules/evdi/evdi.ko" "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum Image.gz mt6797-gemini-pda.dtb mt6797-gemini-pda-hdmi.dtb \
            mt6797-gemini-pda-usbexp.dtb kernel.config *.ko | tee SHA256SUMS
          { echo '## Kernel build artifacts (SHA-256)'; echo '```'; cat SHA256SUMS; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-kernel-${{ github.run_number }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
