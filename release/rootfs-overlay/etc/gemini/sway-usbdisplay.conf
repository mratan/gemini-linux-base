# sway config for the single-output USB-display session (Slice U5, issue #30).
# Launched only by gemini-usb-display-start; never a boot default.
# Target mode per ADR-0004/PRD #25: 1920x1080@60 (a display MODE — motion
# updates are bandwidth-limited over USB 2.0; see the runbook's honest-
# expectations section).
output * mode 1920x1080@60Hz
output * bg #101418 solid_color

# a terminal on launch proves pixels + input end-to-end
exec foot

# the Gemini's own keyboard drives this session; no per-device input config
# needed for the first session. Mod+Shift+e exits (sway default binding set
# is intentionally left enabled).
