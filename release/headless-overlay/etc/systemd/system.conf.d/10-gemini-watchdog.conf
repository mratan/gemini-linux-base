# Pet the MediaTek RGU hardware watchdog from PID 1.
#
# This is what makes a hung experimental kernel recoverable without a human:
# systemd opens /dev/watchdog, programs the hardware timeout, and pings it at
# half that interval. If the kernel wedges or PID 1 stops making progress, the
# RGU resets the SoC and the device comes back on its own.
#
# 30 s, not more: the MediaTek RGU's maximum programmable timeout is 31 s, so a
# larger value here would be silently clamped by the driver and the configured
# number would be a lie. systemd therefore pings every 15 s.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=120
