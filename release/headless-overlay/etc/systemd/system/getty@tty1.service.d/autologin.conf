# Autologin root on tty1 — the VT the internal panel renders (tracker #46).
#
# The pieces for a usable terminal were nearly all present already: getty@tty1
# is enabled by default, fbcon binds the panel about a second into boot, and
# the built-in keyboard registers as an evdev device with the `kbd` handler, so
# it already drives the VT. The only thing missing was that the image was built
# headless, so reaching a shell needed a password nobody has set interactively.
#
# This mirrors the serial console's existing autologin drop-in rather than
# inventing a second convention.
#
# Deliberately tty1 only: tty2-6 keep a normal login prompt, so the panel is
# convenient without every VT on the device being an unauthenticated root
# shell. The device has no lock screen; treat physical access as root access
# either way.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
