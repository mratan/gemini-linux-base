# The console fallback, on tty3 — because tty1 is not available once there is
# a desktop.
#
# WHAT HAPPENED TO tty1
#
# Debian's sddm.service declares
#
#     Conflicts=getty@tty1.service getty@tty7.service
#
# on the assumption that the display manager owns tty1. Here it does not —
# sddm is configured onto VT 2 — but the conflict applies anyway, and it
# cancels the getty's start job before systemd ever looks at the unit. The
# signature is unusually quiet: `systemctl is-enabled getty@tty1` says enabled,
# getty.target is active and lists it in Wants, `journalctl -u getty@tty1 -b`
# says "-- No entries --", and ConditionTimestamp is EMPTY — meaning the
# conditions were never evaluated, so nothing about the getty itself is at
# fault. So for as long as the desktop has existed there has been no shell on
# the panel at all unless sddm was running, which is exactly backwards: a
# console fallback is worth most when the desktop is what broke.
#
# Two wrong turns worth recording so nobody repeats them:
#
#  - Clearing getty@.service's ConditionPathExists=/dev/tty0, on the theory
#    that the device node did not exist yet. It changed nothing. The empty
#    ConditionTimestamp had already ruled that out.
#  - A unit that ran `systemctl start getty@tty1` after boot. That works, and
#    then the conflict fires in the other direction and stops sddm — the
#    desktop came up and was killed 0.1 s later.
#
# And an empty `Conflicts=` in a drop-in does NOT reset the list, unlike
# ExecStart= — verified: sddm still showed the conflict afterwards.
#
# tty3 sidesteps all of it. sddm conflicts only with tty1 and tty7, so a getty
# on tty3 coexists, and Ctrl-Alt-F3 reaches a root shell on the panel whether
# or not the desktop is alive. tty1 keeps the kernel's boot messages, which is
# worth having on the same key.
#
# Autologin for the same reason as the tty1 drop-in: the image is built
# headless, so a password prompt is one nobody has an answer to. tty2 and
# tty4-6 keep a normal login. The device has no lock screen; treat physical
# access as root access either way.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
